name: pim-mcp-test

services:
  dovecot:
    image: dovecot/dovecot:2.4.5
    environment:
      USER_PASSWORD: test-password
    volumes:
      - ./dovecot.conf:/etc/dovecot/conf.d/pim-mcp-test.conf:ro
    ports:
      - "127.0.0.1:31143:31143"
      - "127.0.0.1:31993:31993"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "31143"]
      interval: 2s
      timeout: 2s
      retries: 15

  radicale:
    image: tomsquest/docker-radicale:3.9.0.0
    volumes:
      - ./radicale.conf:/config/config:ro
      - ./radicale.users:/config/users:ro
    ports:
      - "127.0.0.1:35232:5232"

  baikal:
    image: ckulka/baikal:0.10.1-apache
    volumes:
      - ./baikal-seed.sh:/docker-entrypoint.d/20-seed.sh:ro
    ports:
      - "127.0.0.1:35233:80"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 80) ? 0 : 1);"]
      interval: 2s
      timeout: 2s
      retries: 15

  # Heavy, and so left out unless asked for: --profile nextcloud
  nextcloud:
    profiles: [nextcloud]
    image: nextcloud:35.0.2-apache
    environment:
      SQLITE_DATABASE: nextcloud
      NEXTCLOUD_ADMIN_USER: tester
      NEXTCLOUD_ADMIN_PASSWORD: test-password
      NEXTCLOUD_TRUSTED_DOMAINS: 127.0.0.1 localhost
    ports:
      - "127.0.0.1:35234:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost/status.php | grep -q '\"installed\":true'"]
      interval: 5s
      timeout: 5s
      retries: 60
