name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        go: [~1.26, stable]
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6.4.0
        with:
          go-version: ${{ matrix.go }}
      - run: go test -race ./...

  # Run after a failed matrix so branch protection sees a failure, not a skip.
  test-status:
    runs-on: ubuntu-slim
    needs: [test]
    if: ${{ always() }}
    steps:
      - run: test "${{ needs.test.result }}" = success

  build:
    runs-on: ubuntu-latest
    needs: [test-status]
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
      - run: go build -v -o pim-mcp ./cmd/pim-mcp
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: pim-mcp
          path: pim-mcp

  integration:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
      - run: docker compose -f test/integration/compose.yaml up -d --wait
      - run: go test -race -tags integration ./test/integration/...

  nextcloud:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
      # Nextcloud is slow to start, so it has a job of its own.
      - run: docker compose -f test/integration/compose.yaml --profile nextcloud up -d --wait
      - run: go test -race -tags integration ./test/integration/...
        env:
          PIM_MCP_TEST_NEXTCLOUD: "1"
