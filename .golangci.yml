version: "2"

run:
  # The integration tests are behind a build tag, and lint only what it builds.
  build-tags:
    - integration

linters:
  enable:
    - errorlint
    - gosec
    - revive
  exclusions:
    rules:
      # Tests launch the binary they built and read their own fixtures.
      - path: _test\.go
        linters:
          - gosec
        text: G204|G304
