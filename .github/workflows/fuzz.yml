name: Fuzz

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # A short run of each target: it replays the seeds and finds shallow crashers.
  # Hostile mail and invites are the input this server exists to read.
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: ical, target: FuzzParseInvite }
          - { package: ical, target: FuzzExpand }
          - { package: mail, target: FuzzDecodeBase64 }
          - { package: mail, target: FuzzHTMLToText }
          - { package: mail, target: FuzzHTMLScriptNeverShown }
          - { package: mail, target: FuzzMessageID }
          - { package: mail, target: FuzzDecodeID }
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
      - run: go test -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 30s -fuzzminimizetime 1m ./internal/${{ matrix.package }}/
      # The failing input, to reproduce with: go test -run <target>/<name>
      - if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: crasher-${{ matrix.target }}
          path: internal/${{ matrix.package }}/testdata/fuzz/
