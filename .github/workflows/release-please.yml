name: Release Please

on:
  push:
    branches: [main]
  # Re-runs the publish for a tag whose release already exists, after a run
  # that failed partway. GoReleaser replaces what the first run uploaded.
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to publish again, such as v0.1.0
        required: true

permissions:
  contents: read

env:
  DOCKER_REGISTRY: ghcr.io

jobs:
  # Keeps a release PR open from the Conventional Commits on main. Merging it
  # tags the version and creates the GitHub release.
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5.0.0
        id: release
        with:
          config-file: .github/release-please-config.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  # Builds the binaries, packages and image for the tag and attaches them to
  # the release that release-please created.
  publish:
    needs: [release-please]
    if: ${{ !cancelled() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    # Never cancel a publish partway: the image, the cask and the release
    # assets go to three places, and none of them rolls back.
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        run: echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
      - uses: actions/checkout@v6.0.2
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6.4.0
        with:
          cache: false
          go-version-file: go.mod
      - run: go test -race ./...
      - uses: sigstore/cosign-installer@v4.1.2
      - uses: anchore/sbom-action/download-syft@v0.24.3
      - uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: goreleaser/goreleaser-action@v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          HOMEBREW_TOKEN: ${{ secrets.HOMEBREW_TOKEN }}
      - uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-checksums: ./dist/checksums.txt

  # Lists the new image in the official MCP registry. The registry reads the
  # image's io.modelcontextprotocol.server.name label to check ownership, so
  # this runs only after the image is pushed.
  registry:
    needs: [publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: refs/tags/${{ needs.publish.outputs.tag }}
          persist-credentials: false
      - run: curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.9/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      # The image tag is only known at release time, so it is added here.
      - run: |
          jq --arg version "${TAG#v}" --arg tag "$TAG" \
            '.version = $version | .packages[0].identifier += ":" + $tag' \
            server.json > server.tmp
          mv server.tmp server.json
        env:
          TAG: ${{ needs.publish.outputs.tag }}
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
